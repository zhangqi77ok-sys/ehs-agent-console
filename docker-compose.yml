# EHS Agent Console — production-shaped local stack (Ind-05)
# Usage: cp .env.example .env && docker compose up -d --build
# Web UI: http://127.0.0.1:5173  API: http://127.0.0.1:8000/health

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ehs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehs_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ehs}
    volumes:
      - ehs_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ehs}:${POSTGRES_PASSWORD:-ehs_change_me}@db:5432/${POSTGRES_DB:-ehs}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://HOST:7863/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-glm-5.3-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}
      AUTH_MODE: ${AUTH_MODE:-hybrid}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-ehs-agent-console-32b!}
      HITL_ENABLED: ${HITL_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  ehs_pgdata:
