# EHS Agent Console — local stack (Ch6 + Ch14 pgvector image)
# Usage: cp .env.example .env && docker compose up -d --build
# Web: http://127.0.0.1:5173  API: http://127.0.0.1:8000/health

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ehs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehs_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ehs}
    volumes:
      - ehs_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ehs}:${POSTGRES_PASSWORD:-ehs_change_me}@db:5432/${POSTGRES_DB:-ehs}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      HITL_ENABLED: ${HITL_ENABLED:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  ehs_pgdata:
